<title>Goku UI Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: one decision per screen, sticky progress bar on top, sticky action bar at the bottom (thumb reach). */
:root{
  --bg:#f4f3f7; --card:#ffffff; --sunk:#ebe9f1; --fg:#1b1a24; --muted:#5f5c70; --line:#d9d6e3;
  --accent:#e8590c; --accent-fg:#ffffff; --accent-soft:#fde8dc;
  --ok:#1f7a4d; --ok-soft:#dff2e7; --warn:#8a5a00; --warn-soft:#fbefd2; --skip:#5f5c70; --skip-soft:#e7e5ee;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111018; --card:#1b1a25; --sunk:#24222f; --fg:#eeedf5; --muted:#a6a2b8; --line:#34313f;
  --accent:#ff7a33; --accent-fg:#1b0d03; --accent-soft:#3a2214;
  --ok:#5fd39a; --ok-soft:#173326; --warn:#f2c35b; --warn-soft:#352a12; --skip:#a6a2b8; --skip-soft:#2a2834; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111018; --card:#1b1a25; --sunk:#24222f; --fg:#eeedf5; --muted:#a6a2b8; --line:#34313f;
  --accent:#ff7a33; --accent-fg:#1b0d03; --accent-soft:#3a2214;
  --ok:#5fd39a; --ok-soft:#173326; --warn:#f2c35b; --warn-soft:#352a12; --skip:#a6a2b8; --skip-soft:#2a2834; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* top bar */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:grid;gap:8px}
.bar{display:flex;align-items:center;gap:10px}
.brand{font:800 1.05rem/1 var(--display);letter-spacing:-.01em;flex:1;min-width:0}
.brand small{display:block;font:400 .78rem var(--body);color:var(--muted);margin-top:3px}
.icon{border:1px solid var(--line);background:var(--card);border-radius:10px;height:40px;min-width:40px;padding:0 12px;font-weight:700;font-size:.9rem}
.prog{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.counts{display:flex;gap:12px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.counts b{color:var(--fg)}

/* item */
.area{display:inline-flex;gap:6px;align-items:center;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font:800 1.55rem/1.15 var(--display);letter-spacing:-.015em;margin:6px 0 8px;text-wrap:balance}
.why{color:var(--muted);margin:0 0 14px;white-space:pre-line}
.status{font-size:.75rem;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap}
.st-open{background:var(--sunk);color:var(--muted)}
.st-approved{background:var(--ok-soft);color:var(--ok)}
.st-changes{background:var(--warn-soft);color:var(--warn)}
.st-skipped{background:var(--skip-soft);color:var(--skip)}
.label{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}

.shots{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.shot{flex:0 0 auto;scroll-snap-align:start;border:0;padding:0;background:none;text-align:left}
.shot img{display:block;width:120px;max-width:100%;border-radius:10px;border:1px solid var(--line);background:var(--sunk)}
.shot span{display:block;font-size:.78rem;color:var(--muted);margin-top:4px;max-width:120px}

.opts{display:grid;gap:12px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;width:100%}
.opt[aria-checked="true"]{border-color:var(--accent);background:linear-gradient(var(--accent-soft),var(--accent-soft)) padding-box}
.opt .pv{width:96px;border:0;padding:0;background:none}
.opt .pv img{display:block;width:96px;border-radius:8px;border:1px solid var(--line);background:var(--sunk)}
.opt .pv.none{width:0}
.opt h3{margin:0 0 4px;font:700 1.02rem/1.25 var(--body);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.opt p{margin:0;color:var(--muted);font-size:.92rem;white-space:pre-line}
.letter{font:800 .95rem var(--display);color:var(--accent)}
.rec{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--accent);color:var(--accent-fg);border-radius:99px;padding:2px 8px}
.opt.noimg{grid-template-columns:minmax(0,1fr)}

textarea{width:100%;min-height:84px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;resize:vertical}
.hint{font-size:.8rem;color:var(--muted);margin-top:6px}

/* bottom actions */
.actions{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.actions .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:48px minmax(0,1fr) auto 48px;gap:8px}
.btn{height:50px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-size:1.02rem}
.btn:disabled{opacity:.4;cursor:default}

/* list view */
.list{display:grid;gap:8px;margin-top:8px}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;width:100%}
.row .n{font:800 .9rem var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.row .t{font-weight:700;line-height:1.25}
.row .s{font-size:.8rem;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* menu sheet + lightbox */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px}
.sheet h2{font:800 1.2rem var(--display);margin:0}
.sheet p{margin:0;color:var(--muted);font-size:.9rem}
.sheet .btn{width:100%}
#lb{align-items:center;background:rgb(0 0 0 / .9);flex-direction:column;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
#lb img{max-width:100%;max-height:82vh;border-radius:10px;object-fit:contain}
#lb .cap{color:#fff;font-size:.9rem;text-align:center}
#lb .close{background:#fff;color:#111;border:0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:99px;padding:10px 16px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px);text-align:center}
.sync{font-size:.75rem;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){.opt{transition:border-color .12s, background .12s}}
</style>

<div class="wrap">
  <header>
    <div class="bar">
      <div class="brand" id="brand">Goku UI Review<small id="sub"></small></div>
      <button class="icon" id="listBtn" aria-label="All items">All</button>
      <button class="icon" id="menuBtn" aria-label="Save and load">Save</button>
    </div>
    <div class="prog" id="prog" aria-hidden="true"></div>
    <div class="counts" id="counts"></div>
  </header>
  <main id="view"></main>
</div>

<div class="actions" id="actions">
  <div class="in">
    <button class="btn" id="prev" aria-label="Previous item">‹</button>
    <button class="btn primary" id="approve">Approve</button>
    <button class="btn" id="skip">Skip</button>
    <button class="btn" id="next" aria-label="Next item">›</button>
  </div>
</div>

<div class="scrim" id="menu" hidden>
  <div class="sheet" role="dialog" aria-labelledby="menuTitle">
    <h2 id="menuTitle">Save and load</h2>
    <p id="syncNote">Your answers save as you go.</p>
    <button class="btn primary" id="saveJson">Download answers (JSON)</button>
    <button class="btn" id="loadJson">Load a JSON file…</button>
    <button class="btn" id="closeMenu">Close</button>
  </div>
</div>
<div class="scrim" id="lb" hidden><img id="lbImg" alt=""><div class="cap" id="lbCap"></div><button class="btn close" id="lbClose">Close</button></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="filein" accept="application/json,.json" hidden>

<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const IMG = D.images || {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LETTERS = "ABCDEFGH";
const KEY = "review:" + D.batch;

// answers: { [itemId]: { status: open|approved|changes|skipped, choice, note, at } }
let A = {};
let cur = 0, mode = "item", filter = "open";
let db = null, downloads = null;

function loadLocal(){ try { A = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch { A = {}; } }
function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify(A)); } catch {} }
const ans = id => A[id] || { status:"open", choice:null, note:"" };
const statusOf = it => ans(it.id).status;

// Saving: every change goes to this browser at once, and to the shared store (so phone and laptop match, and Claude can read it).
const pending = new Map();
let flushT;
function put(id, patch){
  const a = Object.assign({}, ans(id), patch, { at: new Date().toISOString() });
  // once approved, adding or clearing a note flips between "approved" and "approved with changes"
  if(a.status === "approved" && a.note.trim()) a.status = "changes";
  else if(a.status === "changes" && !a.note.trim()) a.status = "approved";
  A[id] = a; saveLocal();
  if(db){ pending.set(id, a); clearTimeout(flushT); flushT = setTimeout(flush, 600); }
}
async function flush(){
  const batch = [...pending.entries()]; pending.clear();
  for(const [id, a] of batch){
    try { await db.collection("answers").doc(id).set(a); setSync("Saved to your account"); }
    catch(e){ setSync("Saved on this device only (" + (e.code || "error") + ")"); }
  }
}
function setSync(t){ $("#syncNote").textContent = t + ". Download a JSON copy as a backup or to send to Claude."; }

function counts(){
  const c = {open:0, approved:0, changes:0, skipped:0};
  D.items.forEach(it => c[statusOf(it)]++);
  return c;
}
function drawTop(){
  const c = counts(), n = D.items.length;
  $("#sub").textContent = D.title;
  $("#prog").innerHTML = ["approved","changes","skipped"].map(k => `<i style="width:${c[k]/n*100}%;background:var(--${k==="approved"?"ok":k==="changes"?"warn":"skip"})"></i>`).join("");
  $("#counts").innerHTML = `<span><b>${n - c.open}</b> of <b>${n}</b> done</span><span><b>${c.approved}</b> approved</span><span><b>${c.changes}</b> with changes</span><span><b>${c.skipped}</b> skipped</span>`;
}
const STLABEL = {open:"To review", approved:"Approved", changes:"Approved with changes", skipped:"Skipped"};

function drawItem(){
  mode = "item";
  const it = D.items[cur], a = ans(it.id);
  const shots = (it.now || []).map((s,i) => `<button class="shot" data-lb="${esc(s.img)}" data-cap="${esc(s.caption)}"><img src="${IMG[s.img] || ""}" alt="${esc(s.caption)}" loading="lazy"><span>${esc(s.caption)}</span></button>`).join("");
  const opts = it.options.map((o,i) => {
    const img = o.img ? `<span class="pv" data-lb="${esc(o.img)}" data-cap="${esc(LETTERS[i] + ". " + o.label)}" role="button" aria-label="Enlarge picture"><img src="${IMG[o.img] || ""}" alt="" loading="lazy"></span>` : "";
    return `<button class="opt${o.img?"":" noimg"}" role="radio" aria-checked="${a.choice===o.id}" data-choice="${esc(o.id)}">${img}<span><h3><span class="letter">${LETTERS[i]}</span>${esc(o.label)}${o.rec?'<span class="rec">Recommended</span>':""}</h3><p>${esc(o.desc)}</p></span></button>`;
  }).join("");
  $("#view").innerHTML = `
    <div class="area">${esc(cur+1)} of ${D.items.length} · ${esc(it.area)} <span class="status st-${a.status}">${STLABEL[a.status]}</span></div>
    <h1>${esc(it.title)}</h1>
    <p class="why">${esc(it.why)}</p>
    ${shots ? `<div class="label">Now</div><div class="shots">${shots}</div>` : ""}
    <div class="label">Pick one</div>
    <div class="opts" role="radiogroup" aria-label="Options">${opts}</div>
    <div class="label"><label for="note">Changes or fixes (optional)</label></div>
    <textarea id="note" placeholder="Type anything you want different. Approving with a note counts as “approved with changes”.">${esc(a.note)}</textarea>
    <div class="hint">Tap a picture to see it full size.</div>`;
  $("#view").querySelectorAll(".opt").forEach(b => b.addEventListener("click", e => {
    if(e.target.closest("[data-lb]")) return;
    put(it.id, { choice: b.dataset.choice, status: ans(it.id).status === "skipped" ? "open" : ans(it.id).status });
    $("#view").querySelector(".area .status").className = "status st-" + ans(it.id).status;
    $("#view").querySelector(".area .status").textContent = STLABEL[ans(it.id).status];
    $("#view").querySelectorAll(".opt").forEach(x => x.setAttribute("aria-checked", x === b));
    drawActions(); drawTop();
  }));
  $("#note").addEventListener("input", e => { put(it.id, { note: e.target.value }); drawTop(); drawActions(); });
  bindLb();
  drawActions(); drawTop();
  window.scrollTo(0,0);
  try { localStorage.setItem(KEY + ":cur", String(cur)); } catch {}
}
function drawActions(){
  $("#actions").hidden = mode !== "item";
  if(mode !== "item") return;
  const a = ans(D.items[cur].id);
  $("#prev").disabled = cur === 0;
  $("#next").disabled = cur === D.items.length - 1;
  $("#approve").disabled = !a.choice;
  $("#approve").textContent = !a.choice ? "Pick an option" : a.note.trim() ? "Approve with changes" : "Approve " + LETTERS[D.items[cur].options.findIndex(o => o.id === a.choice)];
}
function nextOpen(from){
  for(let k = 1; k <= D.items.length; k++){ const i = (from + k) % D.items.length; if(statusOf(D.items[i]) === "open") return i; }
  return -1;
}
function approve(){
  const it = D.items[cur], a = ans(it.id);
  if(!a.choice) return;
  put(it.id, { status: a.note.trim() ? "changes" : "approved" });
  advance(a.note.trim() ? "Approved with changes" : "Approved");
}
function skip(){ put(D.items[cur].id, { status:"skipped" }); advance("Skipped"); }
function advance(msg){
  const n = nextOpen(cur);
  if(n === -1){ toast(msg + ". That was the last one. Download your answers to send them."); drawList(); return; }
  toast(msg); cur = n; drawItem();
}

function drawList(){
  mode = "list";
  const items = D.items.map((it,i) => ({it,i})).filter(({it}) => filter === "all" || statusOf(it) === filter);
  $("#view").innerHTML = `
    <h1>All items</h1>
    <div class="filters">${[["open","To review"],["changes","With changes"],["approved","Approved"],["skipped","Skipped"],["all","All"]].map(([k,l]) => `<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${l}</button>`).join("")}</div>
    <div class="list">${items.map(({it,i}) => { const a = ans(it.id); const oi = it.options.findIndex(o => o.id === a.choice);
      return `<button class="row" data-i="${i}"><span class="n">${i+1}</span><span><span class="t">${esc(it.title)}</span><br><span class="s">${esc(it.area)}${oi>=0?" · picked "+LETTERS[oi]:""}${a.note.trim()?" · has a note":""}</span></span><span class="status st-${a.status}">${STLABEL[a.status]}</span></button>`; }).join("") || `<p class="why">Nothing here.</p>`}</div>`;
  $("#view").querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => { filter = c.dataset.f; drawList(); }));
  $("#view").querySelectorAll(".row").forEach(r => r.addEventListener("click", () => { cur = +r.dataset.i; drawItem(); }));
  drawActions(); drawTop(); window.scrollTo(0,0);
}

function bindLb(){
  $("#view").querySelectorAll("[data-lb]").forEach(el => el.addEventListener("click", e => {
    e.stopPropagation();
    $("#lbImg").src = IMG[el.dataset.lb] || ""; $("#lbCap").textContent = el.dataset.cap || ""; $("#lb").hidden = false;
  }));
}

function exportData(){
  return { tool:"goku-ui-review", batch:D.batch, title:D.title, savedAt:new Date().toISOString(),
    answers: Object.fromEntries(D.items.map(it => { const a = ans(it.id); const oi = it.options.findIndex(o => o.id === a.choice);
      return [it.id, { title: it.title, status: a.status, choice: a.choice, choiceLetter: oi >= 0 ? LETTERS[oi] : null, choiceLabel: oi >= 0 ? it.options[oi].label : null, note: a.note, at: a.at || null }]; })) };
}
async function saveJson(){
  const text = JSON.stringify(exportData(), null, 1);
  const name = "goku-review-" + D.batch + ".json";
  if(!downloads){ toast("This view can't save files. Open the page in the Claude app or claude.ai."); return; }
  try { await downloads.save({ filename:name, data:text }); toast("Saved " + name); }
  catch(e){ if(e && e.code !== "declined") toast("Couldn't save the file (" + (e.code || "error") + ")"); }
}
function loadJson(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result); const src = j.answers || {};
      let n = 0;
      D.items.forEach(it => { const a = src[it.id]; if(!a) return; put(it.id, { status:a.status || "open", choice:a.choice ?? null, note:a.note || "" }); n++; });
      toast(n ? `Loaded ${n} answers from ${file.name}` : "That file has no answers for this review");
      mode === "list" ? drawList() : drawItem();
    } catch(e){ toast("That file isn't a review JSON"); }
  };
  r.readAsText(file);
}
let tt; function toast(m){ const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2600); }

$("#approve").addEventListener("click", approve);
$("#skip").addEventListener("click", skip);
$("#prev").addEventListener("click", () => { if(cur > 0){ cur--; drawItem(); } });
$("#next").addEventListener("click", () => { if(cur < D.items.length - 1){ cur++; drawItem(); } });
$("#listBtn").addEventListener("click", () => mode === "list" ? drawItem() : drawList());
$("#menuBtn").addEventListener("click", () => $("#menu").hidden = false);
$("#closeMenu").addEventListener("click", () => $("#menu").hidden = true);
$("#menu").addEventListener("click", e => { if(e.target.id === "menu") $("#menu").hidden = true; });
$("#saveJson").addEventListener("click", saveJson);
$("#loadJson").addEventListener("click", () => $("#filein").click());
$("#filein").addEventListener("change", e => { const f = e.target.files[0]; if(f){ loadJson(f); $("#menu").hidden = true; } e.target.value = ""; });
$("#lbClose").addEventListener("click", () => $("#lb").hidden = true);
$("#lb").addEventListener("click", e => { if(e.target.id === "lb") $("#lb").hidden = true; });
document.addEventListener("keydown", e => {
  if(e.target.tagName === "TEXTAREA") return;
  if(e.key === "Escape"){ $("#lb").hidden = true; $("#menu").hidden = true; }
  if(mode !== "item") return;
  if(e.key === "ArrowRight") $("#next").click();
  if(e.key === "ArrowLeft") $("#prev").click();
  const k = LETTERS.indexOf(e.key.toUpperCase()); const b = $("#view").querySelectorAll(".opt")[k]; if(b && k >= 0 && e.key.length === 1) b.click();
});

loadLocal();
try { const c = +localStorage.getItem(KEY + ":cur"); if(c >= 0 && c < D.items.length) cur = c; } catch {}
drawItem();
setSync("Saved on this device");

// Light up the shared store and file saving when this view offers them.
(async () => {
  if(!window.claude?.use) return;
  downloads = await window.claude.use("downloads");
  db = await window.claude.use("db");
  if(!db) return;
  try {
    const snap = await db.collection("answers").get();
    let changed = false;
    snap.docs.forEach(d => { const v = d.data(); const mine = A[d.id];
      if(v && (!mine || (v.at || "") > (mine.at || ""))){ A[d.id] = v; changed = true; } });
    // anything newer here than in the store goes up
    D.items.forEach(it => { const a = A[it.id]; const there = snap.docs.find(d => d.id === it.id);
      if(a && (!there || (a.at || "") > (there.data()?.at || ""))) pending.set(it.id, a); });
    if(pending.size) flush();
    if(changed){ saveLocal(); mode === "list" ? drawList() : drawItem(); }
    setSync("Saved to your account, so your phone and laptop match");
  } catch(e){ setSync("Saved on this device only (" + (e.code || "error") + ")"); }
})();
</script>
