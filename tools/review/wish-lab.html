<!doctype html>
<!-- Review 19 lab: Dragon Balls, Senzu beans, Super Saiyan auras, the over-9,000 moment and Shenron. Drawn from scratch. #balls #auras #nine #shenron #beans -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body { margin: 0; background: #f2f4fa; font: 600 14px -apple-system, system-ui, sans-serif; color: #141a2b; }
  .wrap { display: flex; gap: 14px; align-items: center; justify-content: center; padding: 16px; flex-wrap: wrap; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
  .cell small { color: #55607a; font-weight: 700; } .cell b { font-size: 13px; }
  .card { background: #fff; border: 2.5px solid #141a2b; border-radius: 18px; padding: 14px 16px; box-shadow: 4px 4px 0 #141a2b; }
  .nine { width: 340px; height: 560px; background: radial-gradient(circle at 50% 30%, #13301f, #050a07 70%); border-radius: 28px; border: 3px solid #141a2b; position: relative; overflow: hidden; color: #eafff1; font-family: -apple-system, system-ui, sans-serif; }
  .lens { position: absolute; left: 22px; right: 22px; top: 60px; height: 190px; border-radius: 18px 60px 18px 18px; background: linear-gradient(160deg, rgba(90,255,150,.55), rgba(20,170,80,.35)); border: 3px solid #0d2a18; box-shadow: inset 0 0 30px rgba(180,255,210,.35), 0 0 30px rgba(60,255,140,.35); }
  .lens::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 2px, transparent 2px 5px); border-radius: inherit; }
  .read { position: absolute; left: 0; right: 0; top: 52px; text-align: center; font: 800 64px ui-monospace, 'SF Mono', Menlo, monospace; color: #e9fff0; text-shadow: 0 0 12px #3dff8f, 0 0 2px #fff; letter-spacing: 2px; }
  .lbl2 { position: absolute; left: 0; right: 0; top: 22px; text-align: center; font: 800 13px ui-monospace, Menlo, monospace; letter-spacing: 3px; color: #b8ffd2; }
  .tick { position: absolute; right: 18px; top: 18px; width: 34px; height: 34px; border: 3px solid #b8ffd2; border-radius: 50%; }
  .tick::after { content: ''; position: absolute; inset: 9px; background: #ff4b4b; border-radius: 50%; box-shadow: 0 0 10px #ff4b4b; }
  .big9 { position: absolute; left: 18px; right: 18px; top: 280px; text-align: center; font: 900 40px/1.05 -apple-system, system-ui, sans-serif; color: #ffe46b; text-shadow: 3px 3px 0 #b3261e, 0 0 18px rgba(255,200,60,.5); transform: rotate(-3deg); }
  .sub9 { position: absolute; left: 30px; right: 30px; top: 400px; text-align: center; color: #cfe9d9; font-weight: 600; line-height: 1.4; }
  .btn9 { position: absolute; left: 30px; right: 30px; bottom: 36px; height: 52px; border-radius: 14px; background: #ffe46b; color: #141a2b; border: 3px solid #141a2b; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 17px; }
</style></head><body><div class="wrap" id="w"></div>
<script>
const K = '#1b1f2e';
const starPts = (x, y, r) => Array.from({ length: 10 }, (_, i) => { const a = Math.PI / 5 * i - Math.PI / 2, d = i % 2 ? r * .45 : r; return `${(x + d * Math.cos(a)).toFixed(2)},${(y + d * Math.sin(a)).toFixed(2)}`; }).join(' ');
const SPOTS = [[[20, 21]], [[14, 21], [26, 21]], [[20, 14], [14, 25], [26, 25]], [[14, 15], [26, 15], [14, 26], [26, 26]],
  [[20, 12], [12, 19], [28, 19], [15, 29], [25, 29]], [[13, 13], [20, 13], [27, 13], [13, 26], [20, 26], [27, 26]],
  [[20, 11], [12, 16], [28, 16], [20, 21], [12, 27], [28, 27], [20, 31]]];
// A glass Dragon Ball: amber glass, darker rim, red stars floating inside, a window shine and a soft floor glow.
const ball = (n, lit, px = 56) => `<svg viewBox="0 0 40 40" width="${px}" height="${px}"><defs>
  <radialGradient id="bl${n}${lit}" cx=".4" cy=".36" r=".7"><stop offset="0" stop-color="${lit ? '#fff4c8' : '#f4f6fb'}"/><stop offset=".35" stop-color="${lit ? '#ffc04a' : '#d9dee9'}"/><stop offset=".85" stop-color="${lit ? '#f08a10' : '#b4bccd'}"/><stop offset="1" stop-color="${lit ? '#b45400' : '#8c95a8'}"/></radialGradient></defs>
  <circle cx="20" cy="20" r="18" fill="url(#bl${n}${lit})" stroke="${K}" stroke-width="1.6"/>
  ${SPOTS[n - 1].map(([x, y]) => `<polygon points="${starPts(x, y, n > 4 ? 3.7 : 4.6)}" fill="${lit ? '#e3262f' : '#9aa3b6'}" stroke="${lit ? '#9b1018' : '#7d869a'}" stroke-width=".6"/>`).join('')}
  <path d="M8.5 15a12 12 0 0 1 9-8.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".85"/><circle cx="9" cy="19.5" r="1.2" fill="#fff" opacity=".8"/>
  <path d="M14 33a12 12 0 0 0 16-2" fill="none" stroke="${lit ? '#ffe39a' : '#eef1f7'}" stroke-width="1.6" stroke-linecap="round" opacity=".7"/></svg>`;
const senzu = (px = 26) => `<svg viewBox="0 0 24 18" width="${px}" height="${px * .75}"><defs><radialGradient id="sz" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#e9ffc8"/><stop offset=".5" stop-color="#97dd66"/><stop offset="1" stop-color="#43a032"/></radialGradient></defs>
  <ellipse cx="12" cy="9" rx="9.5" ry="6.8" transform="rotate(-12 12 9)" fill="url(#sz)" stroke="${K}" stroke-width="1.4"/><path d="M6.5 7c2-2 5-2.6 7.5-1.8" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".85"/><path d="M18.5 10.5c-1 1.7-2.6 2.5-4.2 2.5" fill="none" stroke="#3c8f2e" stroke-width="1.3" stroke-linecap="round"/></svg>`;
// The 悟 emblem stands in for anyone's avatar inside each aura.
const emblem = `<circle cx="60" cy="66" r="24" fill="#f58a1f" stroke="${K}" stroke-width="2.5"/><circle cx="60" cy="66" r="16" fill="#fff" stroke="${K}" stroke-width="1.8"/>
  <text x="60" y="74" text-anchor="middle" font-size="22" font-weight="900" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif" fill="${K}">悟</text>`;
// Flame aura: tongues around the avatar, longest at the top, curling upward.
const flame = (amp, seed = 0) => { const pts = [], n = 22;
  for (let i = 0; i <= n * 2; i++) { const t = i / (n * 2) * Math.PI * 2, up = Math.max(0, -Math.sin(t)), side = Math.abs(Math.cos(t));
    const r = i % 2 ? 30 + amp * (0.25 + up * 1.0 + side * .25) * (0.8 + .4 * Math.abs(Math.sin(i * 1.7 + seed))) : 28;
    const lift = i % 2 ? -amp * .35 * (1 - up) : 0;
    pts.push([60 + r * Math.cos(t), 66 + r * Math.sin(t) + lift]); }
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) { const [x, y] = pts[i], [px, py] = pts[i - 1]; d += ` Q${((x + px) / 2 + (i % 2 ? 0 : 0)).toFixed(1)} ${(Math.min(y, py) - 2).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)}`; }
  return d + 'z'; };
const bolts = c => `<path d="M30 40l6 7-4 2 6 8M88 34l-5 8 4 1-6 9M92 84l-7 4 3 3-8 3" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
const FORMS = [
  ['Base form', 'under 7 days', null],
  ['Super Saiyan', '7 days', ['#fff3a0', '#ffd21f', '#f0a800', 16]],
  ['Super Saiyan 2', '14 days', ['#fff3a0', '#ffd21f', '#f0a800', 18, '#7fe8ff']],
  ['Super Saiyan 3', '21 days', ['#fff3a0', '#ffc81f', '#e89a00', 26, '#7fe8ff']],
  ['Super Saiyan God', '30 days', ['#ffd0c8', '#ff5a4a', '#c9201a', 17]],
  ['Super Saiyan Blue', '60 days', ['#e4fbff', '#4fd8ff', '#1f8fe0', 18]],
  ['Ultra Instinct', '100 days', ['#ffffff', '#cfd8ea', '#8fa0c6', 20, null, true]],
];
const aura = (f, i) => { if (!f) return `<svg viewBox="0 0 120 120" width="120" height="120">${emblem}</svg>`;
  const [c0, c1, c2, amp, bolt, ui] = f, id = 'ag' + i;
  return `<svg viewBox="0 0 120 120" width="120" height="120"><defs><radialGradient id="${id}" cx=".5" cy=".58" r=".6"><stop offset=".45" stop-color="${c0}"/><stop offset=".75" stop-color="${c1}"/><stop offset="1" stop-color="${c2}" stop-opacity=".85"/></radialGradient>
    <filter id="gl${i}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter></defs>
    <path d="${flame(amp + 4, i)}" fill="${c1}" opacity=".35" filter="url(#gl${i})"/><path d="${flame(amp, i + 1)}" fill="url(#${id})" stroke="${c2}" stroke-width="1.2" stroke-linejoin="round"/>
    ${ui ? `<path d="M40 30c4 6 2 10-2 14M82 26c-3 7 0 11 4 15M60 18c-2 6 1 9 3 12" fill="none" stroke="#6f86c9" stroke-width="2" stroke-linecap="round" opacity=".8"/>` : ''}
    ${bolt ? bolts(bolt) : ''}${emblem}</svg>`; };
const SHENRON = (() => {
  // Shenron rising from the seven balls: a long scaled body in an S, a dragon head in profile with antler horns and whiskers.
  const body = 'M40 228 C 20 200, 70 186, 96 196 S 150 214, 158 182 S 120 140, 92 150 S 46 150, 52 118 S 104 82, 126 96 S 154 108, 150 76';
  return `<svg viewBox="-6 -14 270 268" width="300" height="298" id="shen"><defs>
    <linearGradient id="sb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fe08a"/><stop offset="1" stop-color="#1f8a45"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".85" r=".5"><stop offset="0" stop-color="#fff6c8"/><stop offset="1" stop-color="#fff6c800"/></radialGradient></defs>
    <ellipse cx="60" cy="232" rx="60" ry="16" fill="url(#glow)"/>
    <g id="fins"></g><path id="spine" d="${body}" fill="none" stroke="${K}" stroke-width="26" stroke-linecap="round"/>
    <path d="${body}" fill="none" stroke="url(#sb)" stroke-width="21" stroke-linecap="round"/>
    <path d="${body}" fill="none" stroke="#e7e07a" stroke-width="7" stroke-linecap="round" stroke-dasharray="6 5" transform="translate(3 4)" opacity=".9"/>
    <path d="${body}" fill="none" stroke="#3fae5a" stroke-width="2" stroke-dasharray="2 9" transform="translate(-4 -4)" opacity=".9"/>
    <g transform="translate(112 18) scale(1.22)">
      <path d="M30 46 C 18 50, 6 46, 2 36 C 0 28, 8 20, 20 18 L 44 14 C 58 12, 76 18, 86 26 C 92 30, 90 38, 84 40 L 66 42 L 74 50 C 64 56, 50 54, 44 50 Z" fill="url(#sb)" stroke="${K}" stroke-width="3" stroke-linejoin="round"/>
      <path d="M66 42 L 84 40 C 86 44, 84 48, 78 50 L 74 50 Z" fill="#c43a3a" stroke="${K}" stroke-width="2" stroke-linejoin="round"/>
      <path d="M68 41l2 4 2-4 2 4 2-4" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M20 18 C 22 8, 34 4, 46 6 L 44 14 Z" fill="#4cc56a" stroke="${K}" stroke-width="2.5" stroke-linejoin="round"/>
      <ellipse cx="48" cy="24" rx="6" ry="4" fill="#fff" stroke="${K}" stroke-width="2"/><ellipse cx="50" cy="24" rx="3" ry="3.4" fill="#e3262f" stroke="${K}" stroke-width="1.4"/>
      <path d="M38 19 C 44 16, 52 16, 58 20" fill="none" stroke="${K}" stroke-width="3" stroke-linecap="round"/>
      <path d="M26 14 C 22 2, 26 -10, 36 -18 M 30 2 L 22 -4 M 33 -8 L 42 -10" fill="none" stroke="#c9a23a" stroke-width="4.2" stroke-linecap="round"/>
      <path d="M40 12 C 42 0, 52 -8, 62 -10 M 48 0 L 46 -8 M 54 -6 L 62 -2" fill="none" stroke="#c9a23a" stroke-width="4.2" stroke-linecap="round"/>
      <path d="M84 30 C 100 24, 108 34, 104 46 C 100 58, 106 66, 112 68" fill="none" stroke="${K}" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M80 36 C 92 40, 96 52, 90 62 C 86 70, 90 78, 96 80" fill="none" stroke="${K}" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="80" cy="25" r="1.6" fill="${K}"/>
    </g>
    <path d="M60 128c-12 4-20 2-26-4M56 136c-10 8-18 8-25 6" fill="none" stroke="${K}" stroke-width="7" stroke-linecap="round"/>
    <path d="M60 128c-12 4-20 2-26-4M56 136c-10 8-18 8-25 6" fill="none" stroke="#4cc56a" stroke-width="4" stroke-linecap="round"/>
    <path d="M34 124l-5-1M34 124l-3 4M31 142l-5 1M31 142l-2 4" stroke="#f4f1e6" stroke-width="2.4" stroke-linecap="round"/>
    ${[[12, 214], [34, 226], [58, 232], [84, 230], [24, 238], [48, 244], [72, 244]].map(([x, y], i) => `<g transform="translate(${x - 10} ${y - 10}) scale(.5)">${ball(i + 1, true, 40).replace(/<svg[^>]*>/, '').replace('</svg>', '')}</g>`).join('')}
  </svg>`; })();
const [mode] = location.hash.slice(1).split(':');
const w = document.getElementById('w');
if (mode === 'balls') w.innerHTML = `<div class="card"><div class="wrap" style="padding:0;gap:6px">${[1, 2, 3, 4, 5, 6, 7].map(n => ball(n, n <= 4)).join('')}</div><p style="margin:8px 0 0;text-align:center;color:#55607a">4 of 7 gathered</p></div>`;
else if (mode === 'beans') w.innerHTML = `<div class="card" style="width:320px"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:18px">Streak</b><span style="color:#55607a;text-decoration:underline">Why?</span></div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><span><b style="font-size:40px">28</b> <span style="color:#55607a;font-size:18px">days</span></span><span style="display:flex;gap:4px">${senzu()}${senzu()}${senzu()}</span></div><p style="margin:6px 0 0;color:#55607a">Today counts. ✓</p></div>`;
else if (mode === 'auras') w.innerHTML = FORMS.map((f, i) => `<div class="cell">${aura(f[2], i)}<b>${f[0]}</b><small>${f[1]}</small></div>`).join('');
else if (mode === 'nine') w.innerHTML = `<div class="nine"><div class="lens"><div class="tick"></div><div class="lbl2">POWER LEVEL</div><div class="read">9,001</div></div>
  <div class="big9">IT'S OVER<br>9,000!</div><div class="sub9">Your power level just passed 9,000.<br>Every workout, meal and check-in got you here.</div><div class="btn9">Keep Training</div></div>`;
else if (mode === 'shenron') { w.innerHTML = `<div class="cell">${SHENRON}</div>`;
  // Back fins: small spikes along the outside of the body, every 16 units, pointing away from the curve.
  const sp = document.getElementById('spine'), L = sp.getTotalLength(), fins = [];
  for (let d = 30; d < L - 20; d += 15) { const a = sp.getPointAtLength(d), b = sp.getPointAtLength(d + 1), tx = b.x - a.x, ty = b.y - a.y, m = Math.hypot(tx, ty), nx = -ty / m, ny = tx / m;
    const bx = a.x + nx * 11, by = a.y + ny * 11; fins.push(`M${(bx - tx / m * 5).toFixed(1)} ${(by - ty / m * 5).toFixed(1)} L${(bx + nx * 9 - tx / m * 3).toFixed(1)} ${(by + ny * 9 - ty / m * 3).toFixed(1)} L${(bx + tx / m * 5).toFixed(1)} ${(by + ty / m * 5).toFixed(1)}z`); }
  document.getElementById('fins').innerHTML = `<path d="${fins.join('')}" fill="#2f9a50" stroke="${K}" stroke-width="2" stroke-linejoin="round"/>`; }
</script></body></html>
