<!doctype html>
<!-- Full-color Dragon Ball icon lab (review 16). Drawn from scratch in Goku's ink-outline sticker style.
     #<id> shows one icon in its real places; #sheet shows them all; #bar:outline|color shows a tab bar + Quick Add mock. -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body { margin: 0; background: #f2f4fa; font: 600 14px -apple-system, system-ui, sans-serif; color: #141a2b; }
  .wrap { display: flex; gap: 22px; align-items: center; justify-content: center; padding: 18px 12px; flex-wrap: wrap; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 74px; font-size: 13px; }
  .tab svg { width: 30px; height: 30px; } .tab span { font-weight: 800; }
  .tile { width: 110px; height: 74px; border: 2.5px solid #141a2b; border-radius: 16px; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .tile svg { width: 32px; height: 32px; }
  .chip { width: 46px; height: 46px; border-radius: 50%; background: #e5e9f4; display: flex; align-items: center; justify-content: center; }
  .chip svg { width: 28px; height: 28px; }
  .big { width: 96px; height: 96px; border: 2px dashed #c5cbe0; border-radius: 18px; display: flex; align-items: center; justify-content: center; }
  .big svg { width: 72px; height: 72px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 112px; } .cell small { font-weight: 600; color: #55607a; }
  .bar { width: 100vw; background: #f2f4fa; border-top: 2.5px solid #141a2b; display: flex; justify-content: space-around; padding: 8px 0 10px; }
  .bar .t { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; color: #55607a; width: 70px; }
  .bar .t svg { width: 28px; height: 28px; } .bar .t.on { color: #141a2b; font-weight: 800; }
  .bar.outline .t svg { color: #8a93a8; } .bar.outline .t.on svg { color: #5aa3ff; }
  .bar.color .t:not(.on) svg { opacity: .55; filter: saturate(.6); }
  .qa { width: 100vw; background: #f2f4fa; padding: 12px 16px; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .qa .tile { width: auto; }
  .plus { width: 52px; height: 52px; border-radius: 50%; background: #5aa3ff; border: 2.5px solid #141a2b; display: flex; align-items: center; justify-content: center; margin-top: -26px; }
</style></head><body><div class="wrap" id="w"></div>

    <circle cx="24" cy="6" r="2.6" fill="#ffd34d" ${SW}/>
    <path d="M8 11 3 25h10zM40 11l-5 14h10z" fill="none" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M2 25a6 3 0 0 0 12 0zM34 25a6 3 0 0 0 12 0z" fill="#ffd34d" ${SW}/>`)],
  heart: ['Check-In', svg(`<path d="M24 42S6 31 6 18a9 9 0 0 1 18-4 9 9 0 0 1 18 4c0 13-18 24-18 24z" fill="url(#ht)" ${SW}/>
    <path d="M12 24h6l3-5 4 10 3-5h8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`, lg('ht', '#ff6b78', '#e0233a'))],
  gear: ['Settings', svg(`<path d="${(() => { const p = []; for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; for (const [d, r] of [[-.22, 14.5], [-.14, 19], [.14, 19], [.22, 14.5]]) p.push([24 + r * Math.cos(a + d), 24 + r * Math.sin(a + d)]); } return 'M' + p.map(([x, y]) => x.toFixed(1) + ' ' + y.toFixed(1)).join(' L') + 'z'; })()}" fill="#9aa6c2" ${SW}/>
    <circle cx="24" cy="24" r="6" fill="#f2f4fa" ${SW}/>`)],
  clock: ['History', svg(`<circle cx="25" cy="25" r="17" fill="#fff"/><path d="M8 25a17 17 0 1 0 5-12" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M6.5 10.5 13 13l-1.2 6.8" fill="none" stroke="#f58a1f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M25 15v10l7 4.5" fill="none" stroke="#3d7bff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="25" cy="25" r="1.8" fill="${INK}"/>`)],
  calendar: ['Week', svg(`<rect x="5" y="9" width="38" height="34" rx="6" fill="#fff" ${SW}/><path d="M5 15a6 6 0 0 1 6-6h26a6 6 0 0 1 6 6v5H5z" fill="#f58a1f" ${SW}/>
    <path d="M15 5v8M33 5v8" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>${[[14, 28], [24, 28], [34, 28], [14, 36], [24, 36]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.4" fill="#3d7bff"/>`).join('')}`)],
  drop: ['Water', svg(`<path d="M24 4S38 20 38 30a14 14 0 0 1-28 0C10 20 24 4 24 4z" fill="url(#dp)" ${SW}/><path d="M17 30a7 7 0 0 0 4 6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".8"/>`, lg('dp', '#8fd8ff', '#2f8dff'))],
  dumbbell: ['Library', svg(`<path d="M12 24h24" stroke="#8a93a8" stroke-width="4" stroke-linecap="round"/>${[[5, 17, 14], [11, 12, 24], [31, 12, 24], [38, 17, 14]].map(([x, y, h]) => `<rect x="${x}" y="${y}" width="5.5" height="${h}" rx="2" fill="#3d4660" ${SW}/>`).join('')}`)],
  arrowsNote: ['', ''],
};
delete ICONS.arrowsNote;

const place = (name, ic) => `<div class="tab">${ic}<span>${name}</span></div><div class="tile">${ic}<span>${name}</span></div><div class="chip">${ic}</div><div class="big">${ic}</div>`;
const [mode, arg] = location.hash.slice(1).split(':');
const w = document.getElementById('w');
if (mode === 'sheet') w.innerHTML = Object.entries(ICONS).map(([k, [, ic]]) => `<div class="cell"><div class="big">${ic}</div><div class="tab" style="width:auto">${ic}</div><small>${k}</small></div>`).join('');
else if (mode === 'bar') {
  // The outline set in use today, beside the full-color set, in a tab bar and the Quick Add grid.
  const O = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const out = { Home: O('<path d="M1.5 21h21"/><path d="M3 21c1-3.2 15-3.2 18 0"/><path d="M5.5 18.2V13h6.5v5"/><path d="M4.3 13.2 8.75 9.6l4.45 3.6"/><path d="M17 18.6c0-3.4.4-6.4 1.6-9"/><path d="M18.6 9.6c-1-1.6-3-2.1-4.6-1.3M18.6 9.6c.2-1.9 1.7-3 3.5-2.9M18.6 9.6c1.7-.3 3 .7 3.4 2.2"/>'),
    Library: O('<path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/>'), Nutrition: O('<path d="M3 12.5h18a9 9 0 0 1-18 0z"/><path d="M5 12.5c1-3 3-4.5 5-3.5 1-2.5 4-2.5 5 0 2-1 4 .5 4 3.5"/><path d="M15.5 2.5l-4 7M19.5 3.5l-5.5 6"/>'),
    You: O('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>') };
  const col = { Home: ICONS.kame[1], Library: ICONS.shell[1], Nutrition: ICONS.bowl[1], You: ICONS.gokuHead[1] };
  const set = arg === 'color' ? col : out;
  const bar = ['Home', 'Library', null, 'Nutrition', 'You'].map((k, i) => k ? `<div class="t${i === 0 ? ' on' : ''}">${set[k]}<span>${k}</span></div>` : '<div class="t"><div class="plus"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#141a2b" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div></div>').join('');
  const qa = arg === 'color' ? [['Food', ICONS.bowl], ['Water', ICONS.drop], ['Senzu', ICONS.senzu], ['Workout', ICONS.stopwatch], ['Other Sport', ICONS.soccer], ['Rest Day', ICONS.sleepGoku], ['Check-In', ICONS.scouter], ['Weigh-In', ICONS.scale]]
    : null;
  w.style.flexDirection = 'column'; w.style.gap = '0'; w.style.padding = '0';
  w.innerHTML = (qa ? `<div class="qa">${qa.map(([n, [, ic]]) => `<div class="tile">${ic}<span>${n}</span></div>`).join('')}</div>` : '') + `<div class="bar ${arg}">${bar}</div>`;
} else if (ICONS[mode]) w.innerHTML = place(ICONS[mode][0], ICONS[mode][1]);

if (mode === 'pick') { const keys = arg.split(','); document.body.style.background = '#ffffff';
  w.innerHTML = keys.map(k => `<div class="cell" style="width:190px"><div style="width:170px;height:170px;display:flex;align-items:center;justify-content:center">${ICONS[k][1].replace('<svg ', '<svg width="150" height="150" ')}</div><b style="font-size:15px">${ICONS[k][0]}</b><small>${k}</small></div>`).join(''); }
</script></body></html>
