<!doctype html>
<!-- Character faces, careful pass (review 18). Drawn from scratch at 96x96 with cel shading. #sheet or #<id>. -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body { margin: 0; background: #f2f4fa; font: 600 14px -apple-system, system-ui, sans-serif; color: #141a2b; }
  .wrap { display: flex; gap: 22px; align-items: flex-end; justify-content: center; padding: 16px; flex-wrap: wrap; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .av { border-radius: 50%; border: 3px solid #141a2b; overflow: hidden; }
  .av svg { display: block; width: 100%; height: 100%; }
</style></head><body><div class="wrap" id="w"></div>
<script>
const K = '#14161f', S = `stroke="${K}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"`;
const SKIN = '#ffd6ac', SKIN_SH = '#efb07e';
const ears = (c = SKIN) => `<path d="M30 50c-5-1-7 3-6 7s4 6 7 5" fill="${c}" ${S}/><path d="M66 50c5-1 7 3 6 7s-4 6-7 5" fill="${c}" ${S}/>`;
const faceShape = c => `<path d="M29.5 42 30.5 58c1.5 10 9 18.5 17.5 20 8.5-1.5 16-10 17.5-20l1-16z" fill="${c}" ${S}/>`;
const goEyes = (mood = 'calm') => mood === 'sleep'
  ? `<path d="M35 57q5 3.5 10 0M51 57q5 3.5 10 0" fill="none" stroke="${K}" stroke-width="2.6" stroke-linecap="round"/>`
  : `<path d="M34 57q6-5 12 .3-6 4.4-12-.3z" fill="#fff" ${S} stroke-width="1.8"/><path d="M50 57.3q6-5.3 12-.3-6 4.7-12 .3z" fill="#fff" ${S} stroke-width="1.8"/>
     <circle cx="41.6" cy="57.1" r="2.9" fill="${K}"/><circle cx="54.4" cy="57.1" r="2.9" fill="${K}"/><circle cx="42.5" cy="56.1" r=".9" fill="#fff"/><circle cx="55.3" cy="56.1" r=".9" fill="#fff"/>
     <path d="M33.5 50 45.5 52.4M62.5 50 50.5 52.4" stroke="${K}" stroke-width="3.2stroke-linecap="round"/>`;
const gi = `<path d="M18 96c2-12 13-18 30-18s28 6 30 18z" fill="#f58a1f" ${S}/><path d="M38 78l10 13 10-13" fill="#2f5fd0" ${S}/>
  <path d="M41 74v6M55 74v6" stroke="${K}" stroke-width="2.4"/>`;
const GOKU_HAIR = 'M30 50 L12 45 L24 38 L5 29 L22 26 L9 12 L30 18 L29 3 L42 15 L50 1 L56 15 L69 3 L67 19 L86 12 L75 27 L92 30 L73 38 L85 46 L66.5 49 L66 40 L60.5 49.5 L57 40.5 L50 55 L46.5 41 L40.5 50 L37 41 L32.5 49z';
const goku = (mood = 'calm') => `${gi}<path d="M41 72h14v8H41z" fill="${SKIN}"/>${ears()}${faceShape(SKIN)}
  <path d="M31 47c6 2.4 11 2.4 16 .8 5 1.6 11 1.6 18-.8l-.3 2.4c-6 1.6-11 1.6-17.2.4-6 1.2-11 1.2-16.2-.4z" fill="${SKIN_SH}" opacity=".7"/>
  ${goEyes(mood)}<path d="M48.5 60l-1.7 4.3h3" fill="none" stroke="${K}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  ${mood === 'sleep' ? `<ellipse cx="48" cy="69.5" rx="2.4" ry="2" fill="${K}"/>` : `<path d="M42.5 68.5q5.5 3.5 11-1" fill="none" stroke="${K}" stroke-width="2.2" stroke-linecap="round"/>`}
  <path d="${GOKU_HAIR}" fill="url(#hairg)" ${S}/>
  <path d="M33 22c4-4 9-6 14-6.5" fill="none" stroke="#6a7698" stroke-width="2.4" stroke-linecap="round" opacity=".55"/>`;
const VEG_HAIR = 'M30 49 L28 30 L22 32 L26 18 L20 18 L30 6 L34 13 L38 1 L44 10 L48 0 L52 10 L58 1 L62 13 L66 6 L76 18 L70 18 L74 32 L68 30 L66.5 49 L64 40 L58 35 L52 37 L48 46 L44 37 L38 35 L32 40z';
const vegeta = `<path d="M16 96c2-12 14-18 32-18s30 6 32 18z" fill="#2c4fb8" ${S}/><path d="M16 92c2-8 8-12 15-13l5 17zM80 92c-2-8-8-12-15-13l-5 17z" fill="#f4f1e6" ${S}/>
  <path d="M41 72h14v8H41z" fill="${SKIN}"/>${ears()}${faceShape(SKIN)}
  <path d="M31 47c5 2 10 1 14-1l3 3 3-3c4 2 9 3 14 1l-.5 4c-5 1.5-10 .5-13.5-1l-3 3-3-3c-3.5 1.5-8.5 2.5-14 1z" fill="${SKIN_SH}" opacity=".8"/>
  <path d="M34.5 57q5.5-3.5 11 .5-5.5 2.6-11-.5zM50.5 57.5q5.5-4 11-.5-5.5 3.1-11 .5z" fill="#fff" ${S} stroke-width="2"/>
  <circle cx="42" cy="57.3" r="2.2" fill="${K}"/><circle cx="54" cy="57.3" r="2.2" fill="${K}"/>
  <path d="M33 50.5 46 55.5M63 50.5 50 55.5" stroke="${K}" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M48.5 60.5l-1.7 4.3h3" fill="none" stroke="${K}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M43 69.5q5-1.5 10 0" fill="none" stroke="${K}" stroke-width="2.2" stroke-linecap="round"/>
  <path d="${VEG_HAIR}" fill="url(#hairg)" ${S}/><path d="M38 14c3-3 7-4.5 11-4.5" fill="none" stroke="#5a6688" stroke-width="3" stroke-linecap="round" opacity=".7"/>`;
const PIC = '#7ccf5a', PIC_SH = '#55a83d';
const piccolo = `<path d="M10 96c3-14 16-21 38-21s35 7 38 21z" fill="#f4f1e6" ${S}/><path d="M28 96c2-10 9-15 20-15s18 5 20 15z" fill="#7a3fc0" ${S}/>
  <path d="M41 72h14v8H41z" fill="${PIC}"/>
  <path d="M31 47 12 34 18 52l13 9" fill="${PIC}" ${S}/><path d="M65 47 84 34 78 52l-13 9" fill="${PIC}" ${S}/>${faceShape(PIC)}
  <path d="M38 64c3 2 7 2.5 10 2.5s7-.5 10-2.5" fill="none" stroke="${PIC_SH}" stroke-width="2" stroke-linecap="round"/>
  <path d="M34.5 56.5q5.5-3.5 11 .5-5.5 2.6-11-.5zM50.5 57q5.5-4 11-.5-5.5 3.1-11 .5z" fill="#fff" ${S} stroke-width="2"/>
  <circle cx="42" cy="56.8" r="2.2" fill="${K}"/><circle cx="54" cy="56.8" r="2.2" fill="${K}"/>
  <path d="M33 50 46 55M63 50 50 55" stroke="${K}" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M43 70h10" stroke="${K}" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M28 46c0-18 9-30 20-30s20 12 20 30z" fill="#f4f1e6" ${S}/><path d="M28 44c6-3 13-4 20-4s14 1 20 4v5c-6-2.5-13-3.5-20-3.5S34 46.5 28 49z" fill="#7a3fc0" ${S}/>
  <path d="M37 20c-2-6-5-11-10-14M59 20c2-6 5-11 10-14" fill="none" stroke="${PIC}" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M37 20c-2-6-5-11-10-14M59 20c2-6 5-11 10-14" fill="none" stroke="${K}" stroke-width="5.6" stroke-linecap="round" opacity=".0"/>
  <path d="M36 26c3-4 6-6 10-7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>`;
const roshi = `<path d="M14 96c2-12 14-18 34-18s32 6 34 18z" fill="#f08a3a" ${S}/><path d="M41 72h14v8H41z" fill="${SKIN}"/>
  ${ears()}<path d="M29 44c0-17 8.5-27 19-27s19 10 19 27l-1 14c-1.5 10-9 18.5-18 20-9-1.5-16.5-10-18-20z" fill="${SKIN}" ${S}/>
  <ellipse cx="41" cy="27" rx="6" ry="3" fill="#fff" opacity=".7"/>
  <path d="M33 54h13l-1 6c-.5 2.2-2.4 3.4-4.6 3.4H39c-2.4 0-4.4-1.6-5-4zM50 54h13l-1 6c-.5 2.2-2.4 3.4-4.6 3.4H56c-2.4 0-4.4-1.6-5-4z" fill="${K}"/><path d="M46 55.5h4M31 55l3-1M65 55l-3-1" stroke="${K}" stroke-width="2"/>
  <path d="M35.5 56.5l3 3" stroke="#6f7a99" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M48.5 62l-2 5h3.5" fill="none" stroke="${K}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M33 67c3 13 8 25 15 27 7-2 12-14 15-27-4 3-9 4-15 4s-11-1-15-4z" fill="#fff" ${S}/>
  <path d="M37 68.5c3.5-2.5 7.5-3 11-1 3.5-2 7.5-1.5 11 1" fill="#fff" ${S} stroke-width="2"/>
  <path d="M42 78l2 9M54 78l-2 9M48 80v10" stroke="#c5cbe0" stroke-width="1.6" stroke-linecap="round"/>`;
const F = { goku: ['Goku', '#ffb46b', goku()], gokuSleep: ['Goku asleep', '#9fd2ff', goku('sleep')], vegeta: ['Vegeta', '#6f9cf5', vegeta], piccolo: ['Piccolo', '#9fd58a', piccolo], roshi: ['Master Roshi', '#ffb98a', roshi] };
const av = (k, px) => `<div class="av" style="width:${px}px;height:${px}px;background:${F[k][1]}"><svg viewBox="0 0 96 96"><defs><linearGradient id="hairg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2f42"/><stop offset="1" stop-color="#101118"/></linearGradient></defs>${F[k][2]}</svg></div>`;
const [mode] = location.hash.slice(1).split(':');
const w = document.getElementById('w');
if (mode === 'sheet') w.innerHTML = Object.keys(F).map(k => `<div class="cell">${av(k, 150)}${av(k, 40)}<small>${F[k][0]}</small></div>`).join('');
else if (mode === 'row') w.innerHTML = ['goku', 'vegeta', 'piccolo', 'roshi'].map(k => `<div class="cell">${av(k, 76)}<small>${F[k][0]}</small></div>`).join('');

else if (mode === 'mascot') w.innerHTML = `<div class="cell"><svg viewBox="0 0 140 130" width="260" height="240"><defs><linearGradient id="hairg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2f42"/><stop offset="1" stop-color="#101118"/></linearGradient>
  <radialGradient id="nbm" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#fff7c2"/><stop offset=".6" stop-color="#ffd84a"/><stop offset="1" stop-color="#f2b81c"/></radialGradient></defs>
  <g transform="translate(22 4)">${goku()}</g>
  <path d="M22 122c-12 0-15-14-5-18-2-11 10-17 20-11 5-10 19-12 26-4 7-6 21-4 22 7 7-3 19 0 19 10 10 0 14 13 4 16-2 7-12 9-19 6-6 6-18 6-23 0-7 5-19 5-24 0-7 3-18 3-20-6z" fill="url(#nbm)" ${S}/>
  <path d="M30 108c4-3 9-3 12 0M74 104c4-3 9-3 12 0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".7"/></svg><small>Setup coach</small></div>`;
</script></body></html>
