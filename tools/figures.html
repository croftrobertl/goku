<!doctype html>
<meta charset="utf-8">
<title>Goku figures (dev preview)</title>
<style>
  body { font: 12px system-ui; background: #fff; color: #111; margin: 12px; }
  .g { display: grid; grid-template-columns: repeat(auto-fill, 236px); gap: 6px; } .pair { display: flex; } .pair .fig { width: 112px; }
  .c { border: 1px solid #ddd; border-radius: 8px; padding: 4px; text-align: center; }
  .fig { width: 140px; height: auto; }
  .fig .limb, .fig .torso { fill: none; stroke: #222; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .fig .far { stroke: #999; } .fig .arm { stroke: #d2691e; } .fig .arm.far { stroke: #f0b58a; }
  .fig .torso { stroke-width: 6; }
  .fig .headc { fill: #222; }
  .fig .ground { stroke: #ccc; stroke-width: 1.5; }
  .fig .prop { fill: none; stroke: #b07a2a; stroke-width: 2; } .fig rect.prop { fill: #e9d3ad; }
  .fig .thick { stroke-width: 3; } .fig .band { stroke: #2a8a5a; stroke-width: 2; fill: none; }
  .fig .wall { stroke-width: 3; } .fig .strap { stroke: #444; stroke-width: 1.5; } .fig .shadow { fill: #ddd; } .fig .soft { fill: #eee; stroke: none; } .fig .hub { fill: #fff; } .fig .dot { fill: #b07a2a; }
  .fig .kit { fill: #3a6fd8; } .fig .kit.far { fill: #9db6ec; } .fig .plate { fill: #3a6fd8; } .fig .handle { fill: none; stroke: #3a6fd8; stroke-width: 2; }
</style>
<h1>Figures</h1>
<div class="g" id="g"></div>
<script type="module">
  // ?from=&n= pick a slice; ?id=a,b shows just those moves; ?big=1 draws them larger. The query on the imports skips stale caches.
  const v = Date.now();
  const { figureSVG } = await import('../js/figure.js?v=' + v);
  const { MOVES } = await import('../js/moves.js?v=' + v);
  const q = new URLSearchParams(location.search);
  const from = +(q.get('from') || 0), n = +(q.get('n') || 24);
  const ids = q.get('id')?.split(',');
  if (q.get('big')) document.head.insertAdjacentHTML('beforeend', '<style>.g{grid-template-columns:repeat(auto-fill,390px)} .pair .fig{width:190px}</style>');
  const list = MOVES.map((m, i) => [m, i]).filter(([m, i]) => ids ? ids.includes(m.id) : i >= from && i < from + n);
  document.getElementById('g').innerHTML = list.map(([m, i]) => `<div class="c"><b>${i}. ${m.name}</b><div class="pair">${figureSVG(m.start)}${figureSVG(m.end)}</div></div>`).join('');
</script>
